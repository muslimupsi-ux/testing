<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Arena Psikologi KPP3023</title>
  <meta name="description" content="Game kuiz interaktif KPP3023 Psikologi dalam Pendidikan: mod solo di Kepulauan Psikologi 3D, mod langsung dengan PIN untuk kelas, leaderboard, lencana dan ulang kaji.">
  <meta name="theme-color" content="#0E2A47">
  <link rel="icon" href="aset/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/arena.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <!-- Tetapan Firebase dan bayaran (sunting fail ini) -->
  <script src="firebase-config.js"></script>
  <!-- Bank soalan -->
  <script src="data/soalan-sim.js"></script>
  <script src="data/soalan-final-a261.js"></script>
  <!-- Kod QR untuk PIN bilik -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
</head>
<body>
  <a class="langkau" href="#app">Langkau ke kandungan</a>
  <header class="bar-atas">
    <a class="jenama" href="#/" aria-label="Arena Psikologi, laman utama">
      <img class="logo" src="aset/favicon.svg" alt="" width="34" height="34">
      <span class="jenama-teks"><b>Arena Psikologi</b><small>KPP3023 Psikologi dalam Pendidikan</small></span>
    </a>
    <div class="bar-kanan">
      <span class="status-talian" id="statusTalian" title="Mod data"></span>
      <button class="ikon-btn" id="btnBunyi" type="button" aria-pressed="true" aria-label="Bunyi"></button>
      <button class="ikon-btn" id="btnTema" type="button" aria-label="Tukar tema terang atau gelap"></button>
      <a class="profil-mini" id="profilMini" href="#/profil" aria-label="Profil saya"></a>
    </div>
  </header>

  <main id="app" tabindex="-1" aria-live="polite">
    <div class="memuat">Memuatkan arena…</div>
  </main>

  <noscript><p class="noscript">Arena Psikologi memerlukan JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
